name: flutter_android_usb_bulk_transfer_example
description: "Example app for flutter_android_usb_bulk_transfer: connect to a USB ESC/POS printer and print a receipt."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  path_provider: ^2.1.5
  flutter_android_usb_bulk_transfer:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sample_receipt.pdf
