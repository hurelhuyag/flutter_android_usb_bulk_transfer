name: flutter_android_usb_bulk_transfer
description: "Transfers data between USB device using bulkTransfer method"
version: 0.0.3
homepage: https://github.com/hurelhuyag/flutter_android_usb_bulk_transfer
repository: https://github.com/hurelhuyag/flutter_android_usb_bulk_transfer
topics:
  - usb
  - printer
  - escpos
  - thermal-printer
  - android

environment:
  sdk: ^3.11.3
  # Flutter 3.41.5 is the first release that ships Dart 3.11.3.
  flutter: '>=3.41.5'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.hurelhuyag.flutter_android_usb_bulk_transfer
        pluginClass: FlutterAndroidUsbBulkTransferPlugin
